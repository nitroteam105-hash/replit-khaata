kind = "web"
previewPath = "/"
title = "Khaata"
version = "1.0.0"
id = "artifacts/khaata"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22277

[services.development]
run = "pnpm --filter @workspace/khaata run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khaata", "run", "build" ]
publicDir = "artifacts/khaata/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22277"
BASE_PATH = "/"
